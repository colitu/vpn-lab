name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Shell syntax
        run: for f in *.sh; do bash -n "$f"; done

      - name: ShellCheck
        run: shellcheck --severity=error *.sh

      - name: Python syntax
        run: python3 -m py_compile *.py
